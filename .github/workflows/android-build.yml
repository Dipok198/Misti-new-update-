
name: MISTY Android Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: misty-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MISTY APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Download source code
      - name: Checkout Source
        uses: actions/checkout@v4

      # 2. Install Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Android SDK (FIXED)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # 4. Setup Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 5. Find Android project
      - name: Locate Android Project
        shell: bash
        run: |
          echo "Searching for Gradle wrapper..."

          GRADLEW_PATH=$(find . \
            -type f \
            -name gradlew \
            -not -path './.git/*' \
            -print -quit)

          if [ -z "$GRADLEW_PATH" ]; then
            echo "ERROR: gradlew not found!"
            echo "Upload extracted Android source code."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW_PATH")

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: Android Gradle settings file missing!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle wrapper JAR missing!"
            exit 1
          fi

          chmod +x "$GRADLEW_PATH"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found: $PROJECT_DIR"

      # 6. Build APK
      - name: Build MISTY Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          ./gradlew \
            --no-daemon \
            --stacktrace \
            clean assembleDebug

      # 7. Upload APK
      - name: Upload MISTY APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MISTY-Android-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
          retention-days: 14

      # 8. Upload build logs if failed
      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MISTY-Build-Error-Reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          if-no-files-found: ignore
